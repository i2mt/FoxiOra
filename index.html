<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ShiftFox</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181d;--mu:#6b7480;--ln:#e3e6ea;--ac:#e8701a;--red:#e5484d;--org:#f0a020}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1216;--card:#181c22;--tx:#eceff3;--mu:#8b95a1;--ln:#262b33}}
:root[data-theme=dark]{--bg:#0f1216;--card:#181c22;--tx:#eceff3;--mu:#8b95a1;--ln:#262b33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(60px + env(safe-area-inset-bottom))}
#v{padding:12px;max-width:560px;margin:auto}h1{font-size:13px;letter-spacing:.08em;color:var(--mu);margin:14px 4px 6px;font-weight:600}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:8px}
.big{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{border-inline-start:4px solid var(--w,#888);padding-inline-start:10px}
.bad{font-size:12px;padding:2px 6px;border-radius:5px;color:#fff}.o{background:var(--red)}.g{background:var(--org)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0;font-size:11px}nav button.on{color:var(--ac)}nav i{display:block;font-style:normal;font-size:19px}
button.p{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;width:100%}
input,select,textarea{width:100%;padding:9px;margin:4px 0 8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
dialog{border:0;border-radius:12px;background:var(--card);color:var(--tx);width:min(92vw,420px)}dialog::backdrop{background:#0008}
.chip{display:inline-block;padding:3px 8px;margin:2px;border:1px solid var(--ln);border-radius:12px;font-size:13px}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:26px;background:var(--ac);color:#fff;border:0;font-size:26px}
</style></head><body><div id="v"></div><button class="fab" onclick="addShift()">+</button>
<nav></nav>
<dialog id="dlg"></dialog><script src="app.js"></script></body></html>
